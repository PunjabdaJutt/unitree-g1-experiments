services:
  g1:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ROS_DISTRO: jazzy
    image: unitree-g1-experiments:jazzy
    # Host networking is required for DDS multicast discovery to reach the
    # robot -- see .agents/skills/docker-ros2-development (bridge networking
    # blocks multicast unless you hand-configure unicast peers).
    network_mode: host
    # CycloneDDS's interface enumeration (getifaddrs/netlink) needs these
    # under Docker's default capability set, even with host networking --
    # without them it reports the pinned interface as "not available" even
    # though it's visible in the container's network namespace.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROBOT_NET_IFACE=${ROBOT_NET_IFACE:-eno1}
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=${LIBGL_ALWAYS_SOFTWARE:-0}
    volumes:
      # Bind-mount source only; colcon build artifacts stay in the image /
      # named volumes so edits don't require a full rebuild but also don't
      # thrash a bind mount.
      - ./ros2_ws/src:/ros2_ws/src:rw
      - ros2_ws_build:/ros2_ws/build
      - ros2_ws_install:/ros2_ws/install
      - ros2_ws_log:/ros2_ws/log
      # Host-backed so camera/lidar recordings (camera_view, lidar_record_video)
      # survive after the --rm container exits, unlike the named volumes above.
      - ./output:/output:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # NOT ${HOME}/.Xauthority -- on this host (GDM/XWayland) that path
      # doesn't exist, and Docker silently creates a bogus empty root-owned
      # directory there when a bind-mount source is missing, which then
      # fails auth inside the container ("Authorization required, but no
      # authorization protocol specified"). ${XAUTHORITY} is the real cookie
      # location for the running session; falls back to ~/.Xauthority for
      # any host where that's actually where it lives.
      - ${XAUTHORITY:-${HOME}/.Xauthority}:/root/.Xauthority:ro
    stdin_open: true
    tty: true
    command: bash

volumes:
  ros2_ws_build:
  ros2_ws_install:
  ros2_ws_log:
